[package]
name = "dfa-visualizer"
version = "1.9.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-shell = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }
tokio = { version = "1.54.1", features = ["full"] }
dirs = "7"
sysinfo = "0.39.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
panic = "abort"
